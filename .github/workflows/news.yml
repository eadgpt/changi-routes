name: Daily Changi headlines + visitor numbers
on:
  schedule:
    - cron: '0 22 * * *'   # 6am Singapore time, every day
  workflow_dispatch:        # "Run workflow" button for a manual run
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python news.py
      - run: python iva.py || echo 'visitor numbers not updated today'   # a SingStat hiccup never blocks the headlines
      - name: Save news.json / iva.json if they changed
        run: |
          git config user.name "news bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json; [ -f iva.json ] && git add iva.json
          git diff --cached --quiet || (git commit -m "Daily update" && git push)
